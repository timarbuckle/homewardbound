{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cat Registry{% endblock %}</title>
    <!-- Pico.css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
    >
    <!--
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'cats/css/output.css' %}" />
    -->
    <script src="{% static 'cats/js/base.js' %}" defer></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline;}
        [x-cloak] { display: none !important;}
        /* Remove Pico's default huge margin below the main content */
        main.container {
            margin-bottom: 0;
            padding-bottom: 1rem; /* Just a tiny bit of breathing room */
        }
        /* Center and style the footer */
        footer {
            margin-top: auto; /* Pushes footer to the bottom of the page */
            text-align: center; /* Centers the text horizontally */
            font-size: 0.85rem; /* Makes the text slightly smaller */
            color: var(--pico-muted-color); /* Uses Pico's nice muted grey color */
            padding: 1.5rem 0; /* Adds a little breathing room above and below */
        }
    </style>
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh;">
      <!-- Pico styles <header> and <nav> automatically -->
      <header class="container">
          <nav>
              <ul>
                  <li><strong>🐈 HomewardBound</strong></li>
              </ul>
              <ul>
                  <li><a href="/">Dashboard</a></li>
                  <li><a href="{% url 'report' %}">Report</a></li>
                  <li><a href="{% url 'update_log_list' %}">Logs</a></li>
              </ul>
          </nav>
      </header>

      <!-- Main content container -->
      <main class="container">
          {% block content %}{% endblock %}
      </main>

      <!-- Restored Compact Single-Line Footer -->
      <footer class="container-fluid">
          &copy; 2026 HomewardBound Cat Registry &bull; Version 1.0.2 &bull; Release: {{ GCP_VERSION}}|Sept 2026
      </footer>

      <script>
          document.body.addEventListener("htmx:configRequest", (event) => {
              event.detail.headers["X-CSRFToken"] = "{{ csrf_token }}";
          });
      </script>
  </body>
</html>
