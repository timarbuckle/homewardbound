{% extends 'cats/base.html' %}
{% block content %}
<!-- Stats Display -->
<!-- Added max-width and margin: 0 auto to constrain and center on desktop -->
<div id="stats-display" style="display: flex; gap: 0.5rem; margin: 0 auto 1rem auto; max-width: 600px; text-align: center;">
    <article style="flex: 1; padding: 0.75rem 0.25rem; margin-bottom: 0;">
        <p style="margin: 0; font-size: 0.75rem; color: var(--pico-muted-color);">Total Cats</p>
        <h3 style="margin: 0; font-size: 1.25rem;">{{ total_cats }}</h3>
    </article>
    <article style="flex: 1; padding: 0.75rem 0.25rem; margin-bottom: 0;">
        <p style="margin: 0; font-size: 0.75rem; color: var(--pico-muted-color);">New Arrivals</p>
        <h3 style="margin: 0; color: var(--pico-primary); font-size: 1.25rem;">{{ new_cats }}</h3>
    </article>
    <article style="flex: 1; padding: 0.75rem 0.25rem; margin-bottom: 0;">
        <p style="margin: 0; font-size: 0.75rem; color: var(--pico-muted-color);">Recently Adopted</p>
        <h3 style="margin: 0; color: #10b981; font-size: 1.25rem;">{{ adopted_cats }}</h3>
    </article>
</div>


<!-- Tightly Packed Single-Row Button Group -->
<nav style="margin-bottom: 1rem;">
    <!-- flex-wrap: nowrap forces them to stay on one line. overflow-x: auto allows swiping if the screen is incredibly small -->
    <ul role="group" style="display: flex; flex-wrap: nowrap; overflow-x: auto; padding-left: 0; margin-bottom: 0; width: 100%;">
        <!-- flex: 1 makes buttons share width equally. Reduced padding to fit on mobile -->
        <li style="flex: 1;">
            <button class="outline" style="width: 100%; padding: 0.5rem 0.25rem; font-size: 0.75rem;" hx-get="{% url 'cat_list' %}?filter=all" hx-target="#cat-table">Available</button>
        </li>
        <li style="flex: 1;">
            <button class="outline" style="width: 100%; padding: 0.5rem 0.25rem; font-size: 0.75rem;" hx-get="{% url 'cat_list' %}?filter=new" hx-target="#cat-table">New</button>
        </li>
        <li style="flex: 1;">
            <button class="outline" style="width: 100%; padding: 0.5rem 0.25rem; font-size: 0.75rem;" hx-get="{% url 'cat_list' %}?filter=adopted" hx-target="#cat-table">Adopted</button>
        </li>
        <li style="flex: 1;">
            <button class="outline" style="width: 100%; padding: 0.5rem 0.25rem; font-size: 0.75rem;" hx-get="{% url 'cat_list' %}?filter=none" hx-target="#cat-table">All</button>
        </li>
    </ul>
</nav>

<!-- Table Container -->
<div id="cat-table">
    {% include 'cats/cat_table.html' %}
</div>

<!-- Image Modal using native <dialog> -->
<dialog id="image-modal">
    <article>
        <header>
            <button aria-label="Close" rel="prev" onclick="document.getElementById('image-modal').close()"></button>
            <strong id="modal-title">Image</strong>
        </header>
        <img id="modal-image" src="" alt="Enlarged cat" />
    </article>
</dialog>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const catTable = document.querySelector("#cat-table");
        if (catTable) {
            htmx.ajax("GET", "{% url 'cat_list' %}?filter=all&sort=name&sort_order=asc", "#cat-table");
        }
    });

    function openImageModal(src, name) {
        document.getElementById('modal-image').src = src;
        document.getElementById('modal-title').innerText = name;
        document.getElementById('image-modal').showModal(); // Native HTML5 modal API
    }
</script>
{% endblock %}
