<div id="log-container" class="overflow-auto">
    <table id="log-table" class="striped">
        <thead>
            <tr>
                <th scope="col">Last Updated</th>
                <th scope="col">Total Cats</th>
                <th scope="col">New Cats</th>
                <th scope="col">Adopted Cats</th>
            </tr>
        </thead>

        <tbody id="log-table-body">
            {% for log in logs %}
            <tr>
                <td>
                    <strong>{{ log.last_updated|date:"M d, Y g:i A" }}</strong>
                </td>
                <td>{{ log.total_cats }}</td>
                <td>{{ log.new_cats }}</td>
                <td>{{ log.adopted_cats }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" style="text-align: center; color: var(--pico-muted-color); padding: 2rem;">
                    No update logs found.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
